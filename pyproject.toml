[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpycrsf"
version = "0.1.0"
description = "Control CRSF (Crossfire/ELRS) based drones from a Raspberry Pi over UART"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "lmwmason" }]
keywords = ["crsf", "elrs", "crossfire", "raspberry-pi", "drone", "rc", "uart", "serial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/lmwmason/rpycrsf"
Issues = "https://github.com/lmwmason/rpycrsf/issues"

[tool.setuptools.packages.find]
where = ["src"]
